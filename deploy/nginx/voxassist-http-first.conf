# Temporary config for the first Certbot HTTP challenge.
# Replace api.yourdomain.com before copying this file to /etc/nginx/conf.d/voxassist.conf.

server {
    listen 80;
    server_name api.yourdomain.com;

    location / {
        return 200 'VoxAssist API - awaiting SSL';
        add_header Content-Type text/plain;
    }
}
